name=PropertiesConfig
property.filename=logs
appenders=file

appender.console.type=Console
appender.console.name=STDOUT
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=[%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n

appender.file.type=RollingFile
appender.file.name=LOGFILE
appender.file.fileName=${filename}/me02.log
appender.file.filePattern=logs/me02-%d{yyyy-MM-dd-HH-mm-ss}-%i.log.gz
appender.file.layout.type=PatternLayout
appender.file.layout.pattern=[%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n
appender.file.policies.type=Policies
appender.file.policies.time.type=TimeBasedTriggeringPolicy
appender.file.policies.time.interval=43200
appender.file.policies.time.modulate=true
appender.file.policies.size.type=SizeBasedTriggeringPolicy
appender.file.policies.size.size=1000MB
appender.file.strategy.type=DefaultRolloverStrategy
appender.file.strategy.max=40
 
loggers=file
logger.file.name=com.solfini
logger.file.level=debug
logger.file.appenderRefs=file
logger.file.appenderRef.file.ref=LOGFILE
 
rootLogger.level=debug
rootLogger.appenderRefs=stdout
rootLogger.appenderRef.stdout.ref=STDOUT

logger.kafka.level=ERROR
logger.kafka.name=org.apache.kafka
logger.zookeeper.level=ERROR
logger.zookeeper.name=org.apache.zookeeper
